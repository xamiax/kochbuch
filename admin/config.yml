backend:
  name: github
  repo: xamiax/kochbuch
  branch: main

media_folder: "_rezepte"

collections:
  - name: "rezepte"
    label: "Rezepte"
    folder: "_rezepte"
    create: true
    path: "{{slug}}/index"
    media_folder: "./"
    public_folder: "./"
    fields:
      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "recipe"

      - label: "Titel"
        name: "title"
        widget: "string"

      - label: "Kategorie"
        name: "category"
        widget: "string"

      - label: "Titelbild"
        name: "image"
        widget: "image"
        required: false

      - label: "Inhalt"
        name: "body"
        widget: "markdown"