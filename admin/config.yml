backend:
  name: github
  repo: DEIN_GITHUB_BENUTZERNAME/DEIN_REPO_NAME
  branch: main

collections:
  - name: "rezepte"
    label: "Rezepte"
    folder: "_rezepte"
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    fields:
      - label: "Titel"
        name: "title"
        widget: "string"

      - label: "Kategorie"
        name: "category"
        widget: "string"

      - label: "Titelbild"
        name: "image"
        widget: "image"
        required: false

      - label: "Inhalt"
        name: "body"
        widget: "markdown"