title: "Kochbuch"
description: "Ein minimalistisches Kochbuch-Template auf GitHub Pages"
baseurl: "/kochbuch"
url: ""

markdown: kramdown

collections:
  rezepte:
    output: true
    permalink: /rezepte/:path/

defaults:
