---
layout: default
title: "Übersicht"
---
<section class="recipe-grid" id="recipe-list">
  {% for item in site.rezepte %}
    <article class="recipe-card" data-category="{{ item.category }}">
      {% if item.image %}
        <a href="{{ item.url | relative_url }}" class="card-image-link">
          <img src="{{ item.url | append: item.image | relative_url }}" alt="{{ item.title }}">
        </a>
      {% endif %}
      <div class="card-content">
        <span class="card-category">{{ item.category }}</span>
        <h2><a href="{{ item.url | relative_url }}">{{ item.title }}</a></h2>
      </div>
    </article>
  {% endfor %}
</section>

<script src="{{ '/assets/js/filter.js' | relative_url }}"></script>
