---
layout: default
---
<article class="recipe">
  <div class="breadcrumb">
    <a href="{{ '/' | relative_url }}">&larr; Zurück zur Übersicht</a>
  </div>

  <header class="recipe-header">
    <h1>{{ page.title }}</h1>
    {% if page.category %}
      <span class="category-badge">{{ page.category }}</span>
    {% endif %}
  </header>

  {% if page.image and page.image != "" %}
    {% assign img_path = page.image | remove_first: "./" %}
    <div class="recipe-image">
      <img src="{{ page.dir | append: img_path | relative_url }}" alt="{{ page.title }}">
    </div>
  {% endif %}

  <div class="recipe-content">
    {{ content }}
  </div>
</article>
